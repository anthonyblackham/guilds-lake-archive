<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4efe4; --panel: #fbf8f1; --ink: #2a241c; --muted: #6d6354; --rule: #d9cfbd; --accent: #2f5f62; --badge: #8a5a2b;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1915; --panel: #24211c; --ink: #ece4d4; --muted: #a89c88; --rule: #3a352c; --accent: #7fb3b0; --badge: #d9a26a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1915; --panel: #24211c; --ink: #ece4d4; --muted: #a89c88; --rule: #3a352c; --accent: #7fb3b0; --badge: #d9a26a; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 19px/1.62 var(--serif) }
a { color: var(--accent) }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 0 80px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)) }
.top { font: 13px var(--sans); padding-block: 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--rule) }
.top a { text-decoration: none }
header { padding-block: 48px 28px }
header h1 { font: 600 clamp(32px, 6vw, 48px)/1.08 var(--serif); margin: 0 0 12px; letter-spacing: -0.015em; text-wrap: balance }
header p.sub { font: italic 21px/1.4 var(--serif); color: var(--muted); margin: 0 }
.status { font: 500 12px var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--badge); margin-top: 18px }
h2 { font: 600 28px/1.2 var(--serif); margin: 56px 0 4px; text-wrap: balance }
p.when { font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 22px }
p { margin: 0 0 1.05em }
p a { text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset: 2px; font-size: 0.86em; font-family: var(--sans) }
figure.fig { margin: 34px calc(50% - min(50vw - 18px, 560px)); }
figure.fig.narrow { margin-left: auto; margin-right: auto; max-width: 640px }
figure.fig.small { margin-left: auto; margin-right: auto; max-width: 360px }
figure img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); background: var(--panel) }
figcaption { font: 14.5px/1.5 var(--sans); color: var(--muted); margin: 10px auto 0; max-width: 720px }
figcaption strong { color: var(--ink) }
figcaption a { font-size: inherit }
.keynum { margin: 36px 0; padding: 18px 22px; border-left: 3px solid var(--badge); background: var(--panel); font: 16px/1.5 var(--sans) }
.keynum span { display: block; font: 600 30px/1.15 var(--serif); color: var(--ink); margin-bottom: 4px }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top"><a href="../../site/">&larr; Guild's Lake Archive</a><span>Stories</span></nav>
  <header>
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
    <p class="status">{{status}}</p>
  </header>
  <main>
{{body}}
  </main>
</div>
</body>
</html>
